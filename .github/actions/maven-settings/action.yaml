# Installs .github/maven/settings.xml as ~/.m2/settings.xml (global-artifacts server and repository).
# Run it after actions/setup-java, which generates its own settings.xml.
name: Maven settings
description: Install the Maven settings of the Syncope fork builds

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        mkdir -p ~/.m2
        cp "$GITHUB_WORKSPACE/.github/maven/settings.xml" ~/.m2/settings.xml
